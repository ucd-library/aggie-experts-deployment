apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
spec:
  template:
    spec:
      nodeSelector: null
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: intended-for
                    operator: In
                    values:
                      - ae-dev-frontend
                      - es-quorum
      containers:
        - name: elasticsearch
          image: us-west1-docker.pkg.dev/aggie-experts/pub/elastic-search:5.2.9
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: microk8s-hostpath
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 15Gi
