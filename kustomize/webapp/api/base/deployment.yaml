apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-api
spec:
  selector:
    matchLabels:
      app: webapp-api
  template:
    metadata:
      labels:
        app: webapp-api
    spec:
      containers:
      - name: service
        command: ["npm", "run", "api"]
        envFrom:
          - configMapRef:
              name: app-config
          - secretRef:
              name: jwt-secret
          - secretRef:
              name: oidc-client-secret
          - secretRef:
              name: slack-webhook-url
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          timeoutSeconds: 2
          periodSeconds: 5
          failureThreshold: 1