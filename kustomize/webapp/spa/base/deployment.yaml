apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-spa
spec:
  selector:
    matchLabels:
      app: webapp-spa
  template:
    metadata:
      labels:
        app: webapp-spa
    spec:
      containers:
      - name: service
        command: ["npm", "run", "spa"]
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          timeoutSeconds: 2
          periodSeconds: 5
          failureThreshold: 1