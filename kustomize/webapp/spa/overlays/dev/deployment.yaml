apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-spa
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: service
          image: us-west1-docker.pkg.dev/aggie-experts/pub/webapp:5.1.1
          env:
            - name: CLIENT_ENV
              value: prod
            - name: EXPERTS_IS_PUBLIC
              value: 'true'
      nodeSelector:
        intended-for: ae-dev-frontend
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: webapp-spa